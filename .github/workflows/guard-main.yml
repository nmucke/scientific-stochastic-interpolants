# Fails when main, or a PR into main, contains any path in .github/dev-only-paths.
# Make the "dev-only-paths" check required for main in branch protection so a
# failing PR cannot be merged.
name: Guard main

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  dev-only-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for dev-only paths
        run: |
          found=0
          while read -r path; do
            files=$(git ls-files -- "$path")
            if [ -n "$files" ]; then
              echo "::error::$path is dev-only and must not reach main:"
              echo "$files" | head -20
              found=1
            fi
          done < <(grep -Ev '^[[:space:]]*(#|$)' .github/dev-only-paths)
          if [ "$found" -ne 0 ]; then
            echo "::error::Open releases into main with .github/scripts/make-release-branch.sh, not from dev directly."
            exit 1
          fi
