# Settings for scripts/compare.py. Every model forecasts the same test
# trajectory. `models` maps a run name in checkpoints/<project>/ to the numbers
# of steps per physical step to compare (map steps for map models, solver steps
# otherwise). The reference forecast is added to every per-step comparison.
#   python scripts/compare.py
#   python scripts/compare.py test_sample_index=3 weights=ema
project: stochastic_navier_stokes
models:
  stochastic_interpolant: [1, 2, 4, 8]
  ns_grid_ito_psd_local: [1, 2, 4, 8]
  ns_grid_ito_psd_kl: [1, 2, 4, 8]
  ns_grid_ito_lsd_local: [1, 2, 4, 8]
  ns_grid_ito_lsd_kl: [1, 2, 4, 8]
  ns_grid_flow_psd: [1, 2, 4, 8]
  ns_grid_flow_lsd: [1, 2, 4, 8]
reference:  # null for none
  name: stochastic_interpolant
  num_steps: 64
weights: model  # model or ema (models without ema.pth fall back to model.pth)

# Forecast
num_physical_steps: 100  # trajectory length, including the conditioning history
batch_size: 10  # ensemble members
test_sample_index: 0  # which test trajectory to forecast
seed: 0  # the same noise seed for every forecast
ode_stepper: scisi.sampling.ode_solvers.euler_step  # flow matching
sde_stepper: scisi.sampling.sde_solvers.heun_step  # stochastic interpolant, diffusion
mixed_precision: true  # bf16 sampling on GPU
device: cuda

# Output: steps_<n>/ per number of steps, summary/ across them
figure_dir: figures/${project}/compare
