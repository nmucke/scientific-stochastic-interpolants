defaults:
- video_common
- video_map_common
- _self_
dataset_name: kth
channels: 1
len_field_history: 10
manifest_path: data/video_forecasting/kth_64/manifest.json
model:
  _target_: scisi.models.flow_map_model.FlowMapModel
  interpolation:
    _target_: scisi.models.interpolations.LinearDeterministicInterpolation
  map_model:
    _target_: scisi.architectures.map_conditioning.MapConditionedNetwork
    backbone: ${backbone}
    path_channels: 0
trainer:
  checkpoint_dir: checkpoints/video/kth/flow_map
evaluation:
  forecast_horizon: 30
teacher:
  checkpoint_dir: checkpoints/video/kth/flow_matching
