defaults:
- video_common
- video_map_common
- _self_
dataset_name: clevrer
channels: 3
len_field_history: 2
manifest_path: data/video_forecasting/clevrer_64/manifest.json
model:
  _target_: scisi.models.follmer_ito_map_model.FollmerItoMapModel
  interpolation:
    _target_: scisi.models.interpolations.QuadraticStochasticInterpolation
    gamma_multiplier: 1.0
    wiener_process: true
  map_model:
    _target_: scisi.architectures.map_conditioning.MapConditionedNetwork
    backbone: ${backbone}
    path_channels: 12
  num_path_features: 4
trainer:
  checkpoint_dir: checkpoints/video/clevrer/follmer_ito_map
evaluation:
  forecast_horizon: 14
teacher:
  checkpoint_dir: checkpoints/video/clevrer/follmer_stochastic_interpolant
