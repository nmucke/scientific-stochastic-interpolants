defaults:
- map_stochastic_navier_stokes_common
- _self_
model:
  _target_: scisi.models.follmer_ito_map_model.FollmerItoMapModel
  interpolation:
    _target_: scisi.models.interpolations.QuadraticStochasticInterpolation
    gamma_multiplier: 1.0
    wiener_process: true
  map_model:
    _target_: scisi.architectures.map_conditioning.MapConditionedNetwork
    backbone:
      _target_: scisi.architectures.u_net.UNet
      in_channels: 1
      out_channels: 1
      hidden_channels:
      - 16
      - 32
      - 64
      - 128
      cond_dim: 1
      cond_embedding_dim: 256
      len_field_history: ${len_field_history}
      field_cond_channels: null
      pars_cond_dim: null
      pars_cond_embedding_dim: null
      multiplier: 2
      num_blocks: 2
      dropout_rate: 0.0
      padding: torch.nn.CircularPad2d
      attention_in_layers:
      - false
      - false
      - false
      - true
      attention:
        target: scisi.architectures.attention.SpatialAttention
        pos_embedding_type: rotary
        heads: 4
        patch_size: 2
        dropout_rate: 0.0
        embedding_dim: 512
    path_channels: 4
  num_path_features: 4
teacher: null
  # checkpoint_dir: checkpoints/stochastic_navier_stokes/stochastic_interpolant
  # initialize_student: true
trainer:
  checkpoint_dir: checkpoints/stochastic_navier_stokes/follmer_ito_map
evaluation:
  output_dir: research/ito_maps/results/follmer_ito_map
