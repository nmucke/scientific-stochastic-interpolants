# KNMI temperature fields with a PDE-transformer backbone.
defaults:
  - data: knmi
  - training: default
  - models: stochastic_interpolant
  - _self_

experiment_tracking:
  project: knmi

gamma_multiplier: 0.1

backbone:
  _target_: scisi.architectures.pde_transformer.PDETransformerWrapper
  in_channels: 1
  out_channels: 1
  len_field_history: ${len_field_history}
  type: PDE-B
  patch_size: 4
  periodic: false
  carrier_token_active: false
  field_cond_channels: 1

train_data:
  batch_size: 64
val_data:
  batch_size: 64
loss_fn:
  _target_: scisi.training.loss_functions.LatitudeWeightedMSELoss
optimizer:
  weight_decay: 0.0000001
scheduler:
  T_max: 500
trainer:
  mixed_precision_warmup: 100
