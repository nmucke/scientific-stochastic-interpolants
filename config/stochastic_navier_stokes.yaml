# Stochastic Navier–Stokes. Choose the model with e.g. `models=flow_matching`.
defaults:
  - data: stochastic_navier_stokes
  - training: default
  - models: stochastic_interpolant
  - _self_

experiment_tracking:
  project: stochastic_navier_stokes

backbone:
  _target_: scisi.architectures.u_net.UNet
  in_channels: 1
  out_channels: 1
  hidden_channels: [16, 32, 64, 128]
  cond_dim: 1 # scalar conditional input, typically pseudo time
  cond_embedding_dim: 256
  len_field_history: ${len_field_history}
  field_cond_channels: null
  pars_cond_dim: null # e.g. Reynolds number, viscosity
  pars_cond_embedding_dim: null
  multiplier: 2 # channel multiplier in the ConvNeXt blocks
  num_blocks: 2 # ConvNeXt blocks per layer
  dropout_rate: 0.1
  padding: torch.nn.CircularPad2d
  attention_in_layers: [false, false, false, true] # last layer is the bottleneck
  attention:
    target: scisi.architectures.attention.SpatialAttention
    pos_embedding_type: rotary
    heads: 4
    patch_size: 2
    dropout_rate: 0.1
    qk_norm: true  # per-head RMSNorm on q and k; bounds attention logits by sqrt(head_dim). Old checkpoints: false
    embedding_dim: 512

# Used by scisi.bin.main_map_model_test for map models.
evaluation:
  checkpoint_dir: ${oc.select:trainer.checkpoint_dir,null}
  checkpoint_name: model.pth
  output_dir: research/ito_maps/results/${model_name}
  num_steps: [1, 2, 4, 8]
  ensemble_size: 16
  origins: [5, 25, 45, 65, 85]
  num_trajectories: 20
  forecast_horizon: 1
  seed: 20261007
  device: cuda
