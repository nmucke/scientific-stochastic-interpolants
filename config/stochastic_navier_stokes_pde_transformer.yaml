# Stochastic Navier–Stokes with a PDE-transformer backbone.
defaults:
  - data: stochastic_navier_stokes
  - training: default
  - models: stochastic_interpolant
  - _self_

experiment_tracking:
  project: stochastic_navier_stokes

gamma_multiplier: 0.1

backbone:
  _target_: scisi.architectures.pde_transformer.PDETransformerWrapper
  in_channels: 1
  out_channels: 1
  len_field_history: ${len_field_history}
  type: PDE-S # S small, B medium, L large
  patch_size: 4
  periodic: true
  carrier_token_active: false
  field_cond_channels: null

train_data:
  batch_size: 64
val_data:
  batch_size: 64
scheduler:
  T_max: 250
