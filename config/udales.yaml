# uDALES urban flow. Choose the model with e.g. `models=flow_matching`.
defaults:
  - data: udales
  - training: map
  - models: ito_map
  - _self_

experiment_tracking:
  project: udales

backbone:
  _target_: scisi.architectures.u_net.UNet
  in_channels: 4
  out_channels: 4
  hidden_channels: [32, 64, 128, 256]
  cond_dim: 1
  cond_embedding_dim: 256
  len_field_history: ${len_field_history}
  field_cond_channels: 1
  pars_cond_dim: null
  pars_cond_embedding_dim: null
  multiplier: 2
  num_blocks: 2
  dropout_rate: 0.1
  padding: torch.nn.CircularPad2d
  attention_in_layers: [false, false, false, true]
  attention:
    target: scisi.architectures.attention.SpatialAttention
    pos_embedding_type: rotary
    heads: 4
    patch_size: 1
    dropout_rate: 0.1
    qk_norm: true  # per-head RMSNorm on q and k; bounds attention logits by sqrt(head_dim). Old checkpoints: false
    embedding_dim: 1024
