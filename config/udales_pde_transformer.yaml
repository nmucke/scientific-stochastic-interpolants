# uDALES urban flow with a PDE-transformer backbone.
defaults:
  - data: udales
  - training: default
  - models: stochastic_interpolant
  - _self_

experiment_tracking:
  project: udales

gamma_multiplier: 0.1

backbone:
  _target_: scisi.architectures.pde_transformer.PDETransformerWrapper
  in_channels: 4
  out_channels: 4
  len_field_history: ${len_field_history}
  type: PDE-B
  patch_size: 4
  periodic: true
  carrier_token_active: false
  field_cond_channels: 1

train_data:
  batch_size: 8
val_data:
  batch_size: 8
