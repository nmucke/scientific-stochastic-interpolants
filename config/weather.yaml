# Weather (WeatherDataset). Choose the model with e.g. `models=flow_matching`.
defaults:
  - data: weather
  - training: default
  - models: stochastic_interpolant
  - _self_

experiment_tracking:
  project: weather

gamma_multiplier: 0.1

backbone:
  _target_: scisi.architectures.u_net.UNet
  in_channels: 1
  out_channels: 1
  hidden_channels: [32, 64, 128, 256]
  cond_dim: 1
  cond_embedding_dim: 256
  len_field_history: ${len_field_history}
  field_cond_channels: null
  pars_cond_dim: null
  pars_cond_embedding_dim: null
  multiplier: 2
  num_blocks: 2
  dropout_rate: 0.1
  padding: torch.nn.CircularPad2d
  attention_in_layers: [false, false, false, false]
  attention:
    target: scisi.architectures.attention.SpatialAttention
    pos_embedding_type: rotary
    heads: 4
    patch_size: 2
    dropout_rate: 0.1
    qk_norm: true  # per-head RMSNorm on q and k; bounds attention logits by sqrt(head_dim). Old checkpoints: false

optimizer:
  weight_decay: 0.00001
scheduler:
  T_max: 500
  eta_min: 0.000001
trainer:
  mixed_precision_warmup: 100
