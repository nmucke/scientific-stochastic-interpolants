# Weather (WeatherDataset) with a PDE-transformer backbone.
defaults:
  - data: weather
  - training: default
  - models: stochastic_interpolant
  - _self_

experiment_tracking:
  project: weather

gamma_multiplier: 0.1

backbone:
  _target_: scisi.architectures.pde_transformer.PDETransformerWrapper
  in_channels: 1
  out_channels: 1
  len_field_history: ${len_field_history}
  type: PDE-B
  patch_size: 4
  periodic: false
  carrier_token_active: false
  field_cond_channels: null

train_data:
  batch_size: 8
val_data:
  batch_size: 8
scheduler:
  T_max: 250
