# Case 1, sequential: K assimilation cycles of the paper's linear-Gaussian system,
# each method's posterior ensemble feeding its next cycle. Reference: Kalman filter.
# With num_cycles=1 this is configs/case/analytical.yaml. See cases/analytical/README.md.
name: analytical_multistep
scenario_name: multistep:paper

plot_dimension: 2
num_cycles: 20             # K
n_eval_samples: 4096       # ensemble size, carried between cycles; the grid and the manuscript use 100000
adapted_variant: true      # also run Ours (shared) with predictive-likelihood resampling

# x^{k+1} = A x^k + w, w ~ N(0, Q);  y^k = H x^k + e, e ~ N(0, R).
# null = identity, a number s = s I, a nested list = that matrix.
system:
  A: null
  Q: null
  H: null
  R: null
