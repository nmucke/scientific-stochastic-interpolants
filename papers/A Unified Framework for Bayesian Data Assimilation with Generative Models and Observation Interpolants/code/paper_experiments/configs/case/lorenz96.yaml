# Case 4 -- stochastic Lorenz 96 with a particle-filter reference. Changing the
# problem block invalidates the convergence evidence of cases/lorenz96/pf_gate.py.
name: lorenz96
project: lorenz96

problem:
  dim_state: 16
  forcing: 8.0
  dt: 0.01
  interval: 0.2       # time between observations
  noise_std: 1.0      # additive model noise per interval
  noise_stages: 1     # kernel N(Phi(x), noise_std^2 I): the optimal proposal is exact
  obs_stride: 4       # every fourth site observed
  obs_variance: 4.0
  prior_std: 1.0
  num_steps: 50       # assimilation steps per sequence

# Trained priors, under checkpoints/lorenz96/.
checkpoints:
  si_run: si
  fm_run: fm

evaluation:
  test_sequences: 12
  validation_sequences: 4
  ensemble_size: 64        # E, matched across generative methods and EnKF
  enkf_large_size: 2000
  seeds: [0, 1, 2]        # also read by run.py through Lorenz96Runner
  device: auto             # samplers only: cuda, then mps, then cpu
  reference_particles: 4000000
  reference_replicates: 2  # the second one measures the reference's own error

# Every generative method runs M = num_steps = 50, fixed by design and not tuned
# (driver.FIXED_NUM_STEPS; `cell`/`tune` refuse other values without --allow-other-m).
# NOT TUNED YET: these are defaults, not chosen values. Set them from `driver.py tune`
# on the validation split only (see GPU_HANDOFF.md) before the final grid.
methods:
  enkf: {inflation: 1.0, localisation: null}
  enkf_large: {inflation: 1.0, localisation: null}
  si_sde: {num_steps: 50, likelihood_mode: inflated, jacobian_damping: 1.0}
  fm_ode: {num_steps: 50, likelihood_mode: inflated, jacobian_damping: 1.0}
  dm_sde: {num_steps: 50, likelihood_mode: inflated, jacobian_damping: 1.0, diffusion_scale: 1.0}

  # Forecast-residual correction (FORECAST_CORRECTION.md, variant A). A `<cell>_fc`
  # cell runs the plain cell's sampler settings above (and its seed stream) with
  # the correction on; the plain cells never read these blocks, so they are
  # unchanged. `correction` keys:
  #   forecast_num_steps  pseudo-time steps of the unguided forecasts f_i (null: the
  #                       sampler's num_steps); few steps are approximate prior draws
  #   localisation        Gaspari-Cohn radius in sites on the periodic lattice (null: none)
  #   gain_scale          multiplier on K_ens - K_q; calibrate on validation only
  #   q_source            online (second forecast per member, default) | exact (the true
  #                       transition variance: closed-form K_q, library q_source=fixed)
  #   update_cap          Mahalanobis cap on the update (null: none)
  #   enabled             false gives the plain sampler, bit for bit
  # Unknown keys are refused. The forecast is always the posterior's own unguided
  # SDE/ODE.
  # Chosen on validation (4 sequences, seed 0, E=64, 8-epoch priors, sampler at
  # dps_jacobian_free M=25), by lowest sliced W2: radius 4 of {2, 4, 8}, gain 0.5 of
  # {0.5, 0.75, 1.0}. gain 0.5 is the grid edge; DM-SDE inherits the FM values
  # untested. See GPU_HANDOFF.md section 13.
  # WARNING: the _fc cells inherit the plain blocks above, which are still the
  # untuned `inflated` M=50 defaults, NOT the dps_jacobian_free M=25 these gains were
  # chosen at. The final grid as configured does not reproduce the validation table;
  # set the plain sampler blocks first, then re-tune the correction.
  si_sde_fc: {correction: {forecast_num_steps: null, localisation: 4, gain_scale: 0.5, q_source: online}}
  fm_ode_fc: {correction: {forecast_num_steps: null, localisation: 4, gain_scale: 0.5, q_source: online}}
  dm_sde_fc: {correction: {forecast_num_steps: null, localisation: 4, gain_scale: 0.5, q_source: online}}
  # Exact per-member kernel + correction, with the exact transition variance for K_q.
  # Radius 4 of {none, 2, 4, 8} on validation.
  oracle_fc: {correction: {localisation: 4, gain_scale: 1.0, q_source: exact}}
  # Unguided trained-prior forecast + EnKF update (the update of the `enkf` cell).
  # inflation / localisation are the `enkf` cell's keys; num_steps (and diffusion_scale
  # for a DM-SDE prior) set the prior's forecast solver. inflation 1.0 and radius 4
  # are the EnKF's validation optimum, not re-tuned for this cell.
  prior_enkf: {prior: si_sde, num_steps: 50, inflation: 1.0, localisation: 4}
  prior_enkf_fm: {prior: fm_ode, num_steps: 50, inflation: 1.0, localisation: 4}

  # --- SURGE SMC cells (cases/lorenz96/_l96_smc.py). NOT TUNED: defaults only. ---
  # One sequence per sampler call (SURGE normalises its weights over every member
  # it is given); N = E = 64 particles, one per member (no particles-per-member knob
  # exists). ess_threshold: resample when ESS/N falls below it (0.5 = multistep and
  # configs/method/surge_*.yaml). Unknown keys are refused.
  # Ours inside SURGE, built as the multistep case (SDE only): the keys of the plain
  # si_sde / dm_sde blocks (own copies, not inherited) + ess_threshold.
  surge_si_sde: {num_steps: 50, likelihood_mode: inflated, jacobian_damping: 1.0, ess_threshold: 0.5}
  surge_dm_sde: {num_steps: 50, likelihood_mode: inflated, jacobian_damping: 1.0, diffusion_scale: 1.0, ess_threshold: 0.5}
  # The same SMC proposing from the unguided prior, one per wrapped prior.
  surge_unguided_si: {num_steps: 50, ess_threshold: 0.5}
  surge_unguided_dm: {num_steps: 50, diffusion_scale: 1.0, ess_threshold: 0.5}
  # NS constructions (_ns_pipeline.build_posterior); every knob of
  # configs/method/surge_{flowdas,sda}.yaml is set here as a scalar (no NS tables;
  # NS env overrides are refused). Values are those files' `default:` entries.
  # guidance_scale = FlowDAS zeta; num_mc_samples = J; max_grad_norm null = no cap.
  surge_flowdas: {num_steps: 50, guidance_scale: 1.0, num_mc_samples: 25, max_grad_norm: null, ess_threshold: 0.5}
  surge_sda: {num_steps: 50, gamma_sda: 0.01, ess_threshold: 0.5}
