# FlowDAS baseline (chen_flowdas_2025): SI-SDE with a Monte-Carlo likelihood
# estimate (J samples of x1 ~ p(x1|x_tau,x0), softmax weight by p(y|x1)).
# Shares the trained prior with our samplers.
name: FlowDAS
stepper: sde
diffusion_term: null

likelihood_model:
  _target_: scisi.likelihood_models.gaussian_likelihood.FlowdasGaussianLikelihood
  # NOTE: the NS/analytical drivers construct FlowdasGaussianLikelihood directly
  # and read the knobs below from this block; J (Monte-Carlo x1 draws) is taken
  # from the case's `likelihood_ensemble_size` (num_mc_samples here is an alias
  # honoured only if the object is instantiated straight from this target).
  num_mc_samples: 25
  # Optional L2 cap on the per-member score to tame blow-ups (null = uncapped).
  max_grad_norm: null

  # Per-cell hyperparameter tables. ANY hyperparameter in this block may be given
  # either as a scalar OR as a [case][scenario][num_sde_steps M] table marked by a
  # `default:` key; the scenario rows live under the case name (`navier_stokes:`).
  # The pipeline (resolve_scheduled_hparams) resolves it to ONE scalar per run from
  # (case_key, scenario_key, num_steps). A missing case / scenario / M column (or a
  # null cell) falls back to `default` with a warning. All three cases now have a
  # filled block, so nothing should hit that fallback. Env FLOWDAS_ZETA overrides
  # the whole table.
  #
  # guidance_scale = FlowDAS zeta on the RAW likelihood score.
  # Provenance:
  #   M=500        : paper setting (superres_16 validated by us, E=64: rmse 0.264).
  #   superres_32 / sparse_5 / sparse_1p5 (M=50/100/250): E=64 tuning sweep, traj1.
  #   superres_16 (M<500): E=16 sweep, RMSE flat in zeta (~0.23) -> approximate.
  # Note: sparse zeta is ~flat in M (~0.002-0.004); superres zeta rises with M.
  guidance_scale:
    default: 1.0
    navier_stokes:
      #             M=50    M=100   M=250   M=500
      superres_16: { 25: 0.016, 50: 0.016, 100: 0.0065, 250: 0.154, 500: 2.0  }
      superres_32: { 25: 0.004, 50: 0.004, 100: 0.052,  250: 0.154, 500: 1.0  }
      sparse_5:    { 25: 0.002, 50: 0.002, 100: 0.002,  250: 0.002, 500: 1.0  }
      sparse_1p5:  { 25: 0.004, 50: 0.004, 100: 0.004,  250: 0.002, 500: 1.75 }
    analytical:              # single joint scenario; columns are the M sweep
      analytical: { 25: 0.004, 50: 0.004, 100: 0.052,  250: 0.154, 500: 1.0  }
    urban:                   # SWEPT ON URBAN 2026-07-30 (run_urban_tuning.sh flowdas)
      sparse_5:    { 25: 0.0005, 50: 0.0005, 100: 0.0005, 250: 0.0005, 500: 0.0005 }
      sparse_1p5:  { 25: 0.0005, 50: 0.0005, 100: 0.0005, 250: 0.0005, 500: 0.0005 }
      sparse_0p78: { 25: 0.0005, 50: 0.0005, 100: 0.0005, 250: 0.0005, 500: 0.0005 }
    # URBAN PROVENANCE: measured, no longer copied from NS. 64-cell sweep,
    # results/urban/tuning/flowdas/, zeta in {0, 1e-5, 5e-5, 1e-4, 2e-4, 5e-4, 1e-3,
    # 2e-3} x {sparse_5, sparse_1p5} x M {25,50,100,250}. Conditions: traj6 (held out
    # of the paper grid's 1..5), seed 0, E=8, num_physical_steps=6 = 1 DA step.
    # zeta=5e-4 wins EVERY one of the 8 cells and is a bracketed interior optimum
    # (2e-4 and 1e-3 both worse on each side), so the value is flat in M and scenario
    # -- hence the identical rows. M=500 carries the same value; the urban grid does
    # not run M=500 (its ladder is {25,50,100,250}), so that column is a placeholder.
    #
    # THIS MOVED THE CELL BY 4-8x. The previous entries (NS sparse verbatim: 0.002 /
    # 0.004) are catastrophic on urban -- rmse 0.33-0.44 against 0.054-0.058 at 5e-4,
    # i.e. ~7x worse, and worse than not assimilating at all. The NS->urban transfer
    # failed exactly where the old comment predicted it might: urban's sparse_5
    # observes ~2081 points (5% of the 10409 FLUID cells x 4 channels) against NS's
    # 819, so the residual the raw likelihood score multiplies is ~2.5x larger.
    #
    # CAVEAT, and it is a real one: tuned at ONE trajectory, ONE seed, E=8 and a
    # SINGLE assimilation step, against the paper grid's E=64 / 15 steps. At 1 step
    # the metric is dominated by prior forecast error -- the zeta=0 control (no
    # guidance at all) scores 0.0602/0.0571/0.0561/0.0556, within 3% of the tuned
    # cell on sparse_5 and within 0.5% on sparse_1p5. So this zeta is the best value
    # measured, but the measurement had little room to discriminate; FlowDAS was not
    # re-run at more DA steps (SDA and FIG were -- see their configs).

posterior_model:
  _target_: scisi.posterior_models.stochastic_interpolant_posterior.StochasticInterpolantPosterior
  resample: false
