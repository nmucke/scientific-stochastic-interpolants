# SDA baseline (rozet_score-based_2023): single-window adaptation of score-based
# data assimilation -- DPS-style observation guidance with SDA's inflated
# measurement covariance Gamma_tau = R + gamma_sda (sigma/mu)^2 H H^T (Rozet &
# Louppe Eq. 15), injected into the reverse SDE with the classifier-guidance
# weight g_tau^2. Runs on the diffusion prior (built from the FM model by
# default). Shares the trained prior with our samplers. NOTE: this is SDA's
# single-window guidance, not the full all-at-once trajectory score (see
# scisi.likelihood_models.sda docstring).
name: SDA
stepper: sde

likelihood_model:
  _target_: scisi.likelihood_models.sda.SDALikelihood
  # NOTE: the NS/analytical drivers construct SDALikelihood directly and read the
  # knobs below from this block.

  # Per-cell hyperparameter tables. ANY hyperparameter in this block may be given
  # either as a scalar OR as a [case][scenario][num_sde_steps M] table marked by a
  # `default:` key; the scenario rows live under the case name (`navier_stokes:`).
  # The pipeline (resolve_scheduled_hparams) resolves it to ONE scalar per run from
  # (case_key, scenario_key, num_steps). A missing case / scenario / M column (or a
  # null cell) falls back to `default` with a warning. All three cases now have a
  # filled block, so nothing should hit that fallback. Env SDA_GAMMA overrides the
  # whole table.
  #
  # gamma_sda = SDA's tunable spectral factor gamma in Gamma ~= gamma I
  # (Rozet & Louppe Eq. 15; released-code default 1e-2).
  gamma_sda:
    default: 0.01
    navier_stokes:
      #             M=50     M=100     M=250     M=500
      superres_16: { 25: 0.001, 50: 0.001,  100: 0.0001, 250: 0.0001, 500: 0.0001 }
      superres_32: { 25: 0.01, 50: 0.01,   100: 0.01,   250: 0.001,  500: 0.001  }
      sparse_5:    { 25: 0.001, 50: 0.001,  100: 0.001,  250: 0.0001, 500: 0.0001 }
      sparse_1p5:  { 25: 0.0001, 50: 0.0001, 100: 0.0001, 250: 0.0001, 500: 0.0001 }
    analytical:              # single joint scenario; columns are the M sweep
      analytical: { 25: 0.01, 50: 0.01,   100: 0.01,   250: 0.001,  500: 0.001  }
    urban:                   # SWEPT ON URBAN 2026-07-30, at 4 DA steps
      sparse_5:    { 25: 0.0005, 50: 0.0005, 100: 0.0005, 250: 0.0005, 500: 0.0005 }
      sparse_1p5:  { 25: 0.0005, 50: 0.0005, 100: 0.0005, 250: 0.0005, 500: 0.0005 }
      sparse_0p78: { 25: 0.0005, 50: 0.0005, 100: 0.0005, 250: 0.0005, 500: 0.0005 }
    # URBAN PROVENANCE: measured, no longer copied from NS. 40-cell sweep,
    # results/urban/tuning_da4/sda/, gamma in {1e-5, 1e-4, 5e-4, 1e-3, 1e-2} x
    # {sparse_5, sparse_1p5} x M {25,50,100,250}. Conditions: traj6 (held out of the
    # paper grid's 1..5), seed 0, E=8, num_physical_steps=9 = 4 DA steps.
    #
    # WHY 4 DA STEPS AND NOT 1. SDA was FIRST swept at 1 DA step
    # (results/urban/tuning/sda/, kept for reference) and won at gamma=1e-3 /
    # sparse_5, 1e-4 / sparse_1p5 -- i.e. it reproduced the NS cells exactly. But at
    # one step the metric is dominated by prior forecast error (the no-guidance
    # control scored 0.0602, BETTER than every SDA cell there), so that agreement was
    # measured in a regime with almost no signal. Re-run at 4 steps, where error
    # accumulates, the optimum moves to 5e-4 for BOTH scenarios. The 4-step table is
    # the one kept here; the 1-step numbers are superseded, not deleted.
    #
    # gamma=5e-4 wins 7 of the 8 cells, losing only sparse_1p5/M=25 to 1e-4 by 0.0002
    # -- inside single-trajectory noise, so the row is written flat rather than
    # encoding a scenario/M split the data does not support. Both neighbours (1e-4,
    # 1e-3) are worse on each side, so this is a bracketed interior optimum. The knob
    # is nearly inert regardless: 0.1579 to 0.1633 across three decades of gamma,
    # ~3.4%. Only the released-code default 1e-2 is clearly bad. M=500 repeats the
    # value; urban's grid ladder is {25,50,100,250}, so that column is a placeholder.
    #
    # CAVEAT: ONE trajectory, ONE seed, E=8, 4 DA steps against the paper grid's
    # E=64 / 15 steps. There is no no-guidance reference at 4 steps, so the RMSE
    # LEVELS here (~0.158) cannot yet be called good or bad -- only the argmin is
    # being used, and the argmin is what this table needs.

posterior_model:
  _target_: scisi.posterior_models.diffusion_posterior.DiffusionPosterior
