# SURGE (DM-SDE) -- SURGE particle filter (wei_surge_2026) on OUR DM-SDE sampler.
#
# SURGE is the SMC layer; our interpolant likelihood supplies the guidance G.
# The proposal is exactly Ours (DM-SDE)'s guided SDE (v + 1/2 g^2 s + w_tau Sbar,
# g = sqrt(alpha beta), w_tau = a_tau + 1/2 g^2) on the trained FM prior; SURGE
# adds the Girsanov-corrected reweighting with the TRUE Gaussian reward on the FM
# Tweedie denoiser and ESS resampling. There is no SURGE (FM-ODE): g = 0 makes
# the Girsanov weight undefined.
#
# Everything except `name` and `posterior_model` is inherited from dm_sde.yaml
# (the driver merges this file over it), including the per-scenario
# jacobian_damping tables.
inherit: dm_sde
name: SURGE (DM-SDE)

posterior_model:
  _target_: scisi.posterior_models.surge_posterior.SurgeLiftedFlowMatchingPosterior
  # Same value as the SURGE (FlowDAS) / SURGE (SDA) baselines; NOT tuned here.
  ess_threshold: 0.5
