# NONLINEAR sparse sensors: h(x) = arctan(c L x) / c on the SAME 5% seeded point
# mask as sparse_5 (L = the sparse_5 selection operator). The standard nonlinear
# DA test of EnSF / FlowDAS / EnFF. Applied in the NORMALISED state space (unit
# std vorticity), so c = 1 already saturates the |x| > 1 tails: g'(x) = 1/(1+c^2 x^2).
#
# NS: launch with +ns_scenarios='["sparse 5% arctan"]'.
#
# STRENGTH SWEEP c in {1, 2, 4}: the strength is overridable from the CLI for every
# nonlinear scenario of the run, e.g.
#     run.py case=navier_stokes '+ns_scenarios=["sparse 5% arctan"]' +nonlinearity_strength=2 \
#            results_file=.../ns_arctan.csv      # -> rows written to ns_arctan__c2.csv
# The tidy rows carry the scenario label only, so with +nonlinearity_strength set
# the results_file automatically gets a `__c<c>` suffix (ExperimentRunner.write);
# saved states carry `__c<c>` in the filename and `obs_strength` in the npz.
# c -> 0 recovers sparse_5 exactly (g(z) -> z); `name: identity` IS sparse_5.
name: sparse 5% arctan
type: sparse
fraction: 0.05

# Linear sensor map L (its _target_ is ignored by the pipeline builders; the
# nonlinearity block below wraps it in PointwiseObservationOperator(inner=L)).
obs_operator:
  _target_: scisi.likelihood_models.observation_operators.LinearObservationOperator
  type: random
  percent_obs: 0.05
  seed: 42  # overridden by common.seeding.mask_seed(case, seed_scenario)

nonlinearity:
  operator: pointwise   # PointwiseObservationOperator, h = g(L x)
  name: arctan          # one of observation_operators.NONLINEARITIES
  strength: 1.0         # c; sweep {1, 2, 4} via +nonlinearity_strength=c
  eps: 1.0e-3           # only used by `abs`

# Reuse sparse_5's sensor mask AND observation-noise draws (seeds are derived from
# this label), so the only difference to the linear cell is h.
seed_scenario: sparse 5%
# Hyperparameter tables in configs/method/*.yaml are looked up under this key (the
# linear sparse_5 row) -- a starting point only: RE-TUNE for the nonlinear h.
hparam_scenario: sparse_5
