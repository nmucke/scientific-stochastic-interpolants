dataset_name: clevrer
channels: 3
len_field_history: 2
manifest_path: data/video_forecasting/clevrer_64/manifest.json
preprocesser: null
seed: 0
num_threads: 4
overwrite: false
initial_student_checkpoint: checkpoints/video/clevrer/flow_map_psd/model.pth
experiment_tracking:
  enabled: false
  project: video_forecasting
backbone:
  _target_: scisi.architectures.u_net.UNet
  in_channels: 3
  out_channels: 3
  hidden_channels:
  - 16
  - 32
  - 64
  cond_dim: 1
  cond_embedding_dim: 128
  len_field_history: 2
  field_cond_channels: null
  pars_cond_dim: null
  pars_cond_embedding_dim: null
  multiplier: 2
  num_blocks: 2
  dropout_rate: 0.0
  padding: torch.nn.ZeroPad2d
  attention_in_layers:
  - false
  - false
  - true
  attention:
    target: scisi.architectures.attention.SpatialAttention
    pos_embedding_type: rotary
    heads: 4
    patch_size: 2
    dropout_rate: 0.0
    embedding_dim: 128
train_data:
  _target_: torch.utils.data.DataLoader
  batch_size: 16
  shuffle: true
  num_workers: 0
  dataset:
    _target_: scisi.data.video_datasets.VideoFrameDataset
    manifest_path: data/video_forecasting/clevrer_64/manifest.json
    split: train
    len_field_history: 2
    window_stride: 1
val_data:
  _target_: torch.utils.data.DataLoader
  batch_size: 16
  shuffle: true
  num_workers: 0
  dataset:
    _target_: scisi.data.video_datasets.VideoFrameDataset
    manifest_path: data/video_forecasting/clevrer_64/manifest.json
    split: validation
    len_field_history: 2
    window_stride: 10
test_data:
  _target_: scisi.data.video_datasets.VideoFrameDataset
  manifest_path: data/video_forecasting/clevrer_64/manifest.json
  split: test
  len_field_history: 2
  train_or_test: test
optimizer:
  _target_: torch.optim.AdamW
  lr: 5.0e-05
  weight_decay: 1.0e-06
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 10
  eta_min: 1.0e-05
loss_fn:
  _target_: torch.nn.MSELoss
trainer:
  _target_: scisi.training.map_trainer.MapTrainer
  num_epochs: 10
  max_train_batches: 50
  max_val_batches: 8
  validation_seed: 1937
  device: cuda
  checkpoint_dir: checkpoints/video/clevrer/flow_map
  resume_from: null
  mixed_precision_warmup: 0
  early_stopping:
    _target_: scisi.training.trainer.EarlyStopping
    patience: 30
  gradient_clipper:
    _target_: scisi.training.gradient_clipping.EmaGradientClipper
    ema_coef1: 0.9
    ema_coef2: 0.99
    max_norm_ratio: 2.0
    clip_norm_ratio: 1.1
  objective: teacher_rollout
  diagonal_weight: 1
  consistency_weight: 1.0
  ema_decay: 0.95
  diagonal_warmup_steps: 0
  consistency_ramp_steps: 0
  interval_curriculum_steps: 0
  initial_max_interval: 1
  endpoint_probability: 0.5
  teacher_steps: 32
evaluation:
  forecast_horizon: 14
  ensemble_size: 4
  num_clips: 128
  seed: 20261007
  device: cuda
teacher:
  initialize_student: true
  checkpoint_dir: checkpoints/video/clevrer/flow_matching
model:
  _target_: scisi.models.flow_map_model.FlowMapModel
  interpolation:
    _target_: scisi.models.interpolations.LinearDeterministicInterpolation
  map_model:
    _target_: scisi.architectures.map_conditioning.MapConditionedNetwork
    backbone:
      _target_: scisi.architectures.u_net.UNet
      in_channels: 3
      out_channels: 3
      hidden_channels:
      - 16
      - 32
      - 64
      cond_dim: 1
      cond_embedding_dim: 128
      len_field_history: 2
      field_cond_channels: null
      pars_cond_dim: null
      pars_cond_embedding_dim: null
      multiplier: 2
      num_blocks: 2
      dropout_rate: 0.0
      padding: torch.nn.ZeroPad2d
      attention_in_layers:
      - false
      - false
      - true
      attention:
        target: scisi.architectures.attention.SpatialAttention
        pos_embedding_type: rotary
        heads: 4
        patch_size: 2
        dropout_rate: 0.0
        embedding_dim: 128
    path_channels: 0
