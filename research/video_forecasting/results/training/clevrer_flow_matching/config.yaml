dataset_name: clevrer
channels: 3
len_field_history: 2
manifest_path: data/video_forecasting/clevrer_64/manifest.json
preprocesser: null
seed: 0
num_threads: 4
overwrite: false
initial_student_checkpoint: null
experiment_tracking:
  enabled: false
  project: video_forecasting
backbone:
  _target_: scisi.architectures.u_net.UNet
  in_channels: 3
  out_channels: 3
  hidden_channels:
  - 16
  - 32
  - 64
  cond_dim: 1
  cond_embedding_dim: 128
  len_field_history: 2
  field_cond_channels: null
  pars_cond_dim: null
  pars_cond_embedding_dim: null
  multiplier: 2
  num_blocks: 2
  dropout_rate: 0.0
  padding: torch.nn.ZeroPad2d
  attention_in_layers:
  - false
  - false
  - true
  attention:
    target: scisi.architectures.attention.SpatialAttention
    pos_embedding_type: rotary
    heads: 4
    patch_size: 2
    dropout_rate: 0.0
    embedding_dim: 128
train_data:
  _target_: torch.utils.data.DataLoader
  batch_size: 16
  shuffle: true
  num_workers: 0
  dataset:
    _target_: scisi.data.video_datasets.VideoFrameDataset
    manifest_path: data/video_forecasting/clevrer_64/manifest.json
    split: train
    len_field_history: 2
    window_stride: 1
val_data:
  _target_: torch.utils.data.DataLoader
  batch_size: 16
  shuffle: true
  num_workers: 0
  dataset:
    _target_: scisi.data.video_datasets.VideoFrameDataset
    manifest_path: data/video_forecasting/clevrer_64/manifest.json
    split: validation
    len_field_history: 2
    window_stride: 10
test_data:
  _target_: scisi.data.video_datasets.VideoFrameDataset
  manifest_path: data/video_forecasting/clevrer_64/manifest.json
  split: test
  len_field_history: 2
  train_or_test: test
optimizer:
  _target_: torch.optim.AdamW
  lr: 0.0002
  weight_decay: 1.0e-06
scheduler:
  _target_: torch.optim.lr_scheduler.CosineAnnealingLR
  T_max: 200
  eta_min: 2.0e-05
loss_fn:
  _target_: torch.nn.MSELoss
trainer:
  _target_: scisi.training.local_trainer.LocalTrainer
  num_epochs: 200
  max_train_batches: 100
  max_val_batches: 8
  validation_seed: 1937
  device: cuda
  checkpoint_dir: checkpoints/video/clevrer/flow_matching
  resume_from: null
  mixed_precision_warmup: 0
  early_stopping:
    _target_: scisi.training.trainer.EarlyStopping
    patience: 250
  gradient_clipper:
    _target_: scisi.training.gradient_clipping.EmaGradientClipper
    ema_coef1: 0.9
    ema_coef2: 0.99
    max_norm_ratio: 2.0
    clip_norm_ratio: 1.1
evaluation:
  forecast_horizon: 14
  ensemble_size: 4
  num_clips: 128
  seed: 20261007
  device: cuda
model:
  _target_: scisi.models.flow_matching_model.FlowMatchingModel
  interpolation:
    _target_: scisi.models.interpolations.LinearDeterministicInterpolation
  drift_model:
    _target_: scisi.architectures.u_net.UNet
    in_channels: 3
    out_channels: 3
    hidden_channels:
    - 16
    - 32
    - 64
    cond_dim: 1
    cond_embedding_dim: 128
    len_field_history: 2
    field_cond_channels: null
    pars_cond_dim: null
    pars_cond_embedding_dim: null
    multiplier: 2
    num_blocks: 2
    dropout_rate: 0.0
    padding: torch.nn.ZeroPad2d
    attention_in_layers:
    - false
    - false
    - true
    attention:
      target: scisi.architectures.attention.SpatialAttention
      pos_embedding_type: rotary
      heads: 4
      patch_size: 2
      dropout_rate: 0.0
      embedding_dim: 128
